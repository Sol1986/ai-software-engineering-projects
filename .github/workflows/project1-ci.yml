name: Project 1 CI

on:
  push:
    paths:
      - "Project 1 Production-Style Python AI API/**"
      - ".github/workflows/project1-ci.yml"
  pull_request:
    paths:
      - "Project 1 Production-Style Python AI API/**"
      - ".github/workflows/project1-ci.yml"

defaults:
  run:
    working-directory: "Project 1 Production-Style Python AI API"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "Project 1 Production-Style Python AI API/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint code
        run: uv run ruff check .

      - name: Type-check code
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest